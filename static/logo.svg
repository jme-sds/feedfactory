<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <g id="news-blade" filter="url(#shadow)">
      <rect x="-60" y="-250" width="120" height="250" fill="#e5e5e5" stroke="#000000" stroke-width="1" transform="rotate(-8)"/>
      <rect x="-60" y="-250" width="120" height="250" fill="#f4f4f4" stroke="#000000" stroke-width="1" transform="rotate(-4)"/>

      <rect x="-60" y="-250" width="120" height="250" fill="#ffffff" stroke="#000000" stroke-width="2"/>

      <rect x="-50" y="-235" width="100" height="22" fill="#000000"/>
      <rect x="-50" y="-208" width="100" height="2" fill="#000000"/>
      <rect x="-50" y="-203" width="100" height="1" fill="#000000"/>

      <rect x="-50" y="-193" width="46" height="42" fill="#000000"/>
      <rect x="-50" y="-145" width="46" height="3" fill="#000000"/>
      <rect x="-50" y="-137" width="38" height="3" fill="#000000"/>
      <rect x="-50" y="-129" width="42" height="3" fill="#000000"/>
      <rect x="-50" y="-121" width="30" height="3" fill="#000000"/>

      <rect x="4" y="-193" width="46" height="7" fill="#000000"/>
      <rect x="4" y="-182" width="35" height="7" fill="#000000"/>
      <rect x="4" y="-168" width="46" height="3" fill="#000000"/>
      <rect x="4" y="-160" width="42" height="3" fill="#000000"/>
      <rect x="4" y="-152" width="45" height="3" fill="#000000"/>
      <rect x="4" y="-144" width="39" height="3" fill="#000000"/>
      <rect x="4" y="-136" width="44" height="3" fill="#000000"/>
      <rect x="4" y="-128" width="41" height="3" fill="#000000"/>
      <rect x="4" y="-120" width="46" height="3" fill="#000000"/>

      <rect x="-50" y="-108" width="100" height="1" fill="#000000"/>

      <rect x="-50" y="-100" width="75" height="5" fill="#000000"/>

      <rect x="-50" y="-88" width="30" height="3" fill="#000000"/>
      <rect x="-50" y="-80" width="26" height="3" fill="#000000"/>
      <rect x="-50" y="-72" width="28" height="3" fill="#000000"/>
      <rect x="-50" y="-64" width="29" height="3" fill="#000000"/>
      <rect x="-50" y="-56" width="24" height="3" fill="#000000"/>
      <rect x="-50" y="-48" width="30" height="3" fill="#000000"/>
      <rect x="-50" y="-40" width="27" height="3" fill="#000000"/>
      <rect x="-50" y="-32" width="18" height="3" fill="#000000"/>

      <rect x="-15" y="-88" width="30" height="3" fill="#000000"/>
      <rect x="-15" y="-80" width="28" height="3" fill="#000000"/>
      <rect x="-15" y="-72" width="25" height="3" fill="#000000"/>
      <rect x="-15" y="-64" width="30" height="3" fill="#000000"/>
      <rect x="-15" y="-56" width="27" height="3" fill="#000000"/>
      <rect x="-15" y="-48" width="22" height="3" fill="#000000"/>
      <rect x="-15" y="-40" width="29" height="3" fill="#000000"/>
      <rect x="-15" y="-32" width="26" height="3" fill="#000000"/>

      <rect x="20" y="-88" width="30" height="3" fill="#000000"/>
      <rect x="20" y="-80" width="29" height="3" fill="#000000"/>
      <rect x="20" y="-72" width="26" height="3" fill="#000000"/>
      <rect x="20" y="-64" width="28" height="3" fill="#000000"/>
      <rect x="20" y="-56" width="30" height="3" fill="#000000"/>
      <rect x="20" y="-48" width="23" height="3" fill="#000000"/>
      <rect x="20" y="-40" width="27" height="3" fill="#000000"/>
      <rect x="20" y="-32" width="14" height="3" fill="#000000"/>

      <rect x="-60" y="-5" width="120" height="5" fill="#000000"/>
    </g>

    <g id="kaleido-ring">
      <use href="#news-blade" transform="rotate(0)"/>
      <use href="#news-blade" transform="rotate(45)"/>
      <use href="#news-blade" transform="rotate(90)"/>
      <use href="#news-blade" transform="rotate(135)"/>
      <use href="#news-blade" transform="rotate(180)"/>
      <use href="#news-blade" transform="rotate(225)"/>
      <use href="#news-blade" transform="rotate(270)"/>
      <use href="#news-blade" transform="rotate(315)"/>
    </g>
  </defs>

  <rect width="800" height="800" fill="#161616"/>

  <g transform="translate(400, 400)">
    <use href="#kaleido-ring" transform="scale(1.2) rotate(0)"/>
    <use href="#kaleido-ring" transform="scale(0.7) rotate(22.5)"/>
    <use href="#kaleido-ring" transform="scale(0.35) rotate(45)"/>
  </g>
</svg>
